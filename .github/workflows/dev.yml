name: Dev
'on':
  push:
    branches:
    - integration
    - dev
  pull_request:
    branches:
    - dev
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/feature/') }}
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      phase: ${{ steps.route.outputs.phase }}
      scope: ${{ steps.classify.outputs.scope }}
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
      infra: ${{ steps.classify.outputs.infra }}
      image: ${{ steps.classify.outputs.image }}
      security: ${{ steps.classify.outputs.security }}
      deploy: ${{ steps.classify.outputs.deploy }}
      backend_runtime: ${{ steps.classify.outputs.backend_runtime }}
    steps:
    - id: route
      name: Select the stage operation
      env:
        EVENT: ${{ github.event_name }}
        REF: ${{ github.ref }}
        HEAD_REF: ${{ github.head_ref }}
        BASE_REF: ${{ github.base_ref }}
        SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      run: |
        set -euo pipefail
        if [ "$EVENT" = pull_request ]; then
          test "$SAME_REPOSITORY" = true
          test "$BASE_REF" = "dev"
          case "$HEAD_REF" in integration) ;; *) exit 1 ;; esac
          echo phase=verify >> "$GITHUB_OUTPUT"
        else
          case "$REF" in
            refs/heads/integration) echo phase=verify >> "$GITHUB_OUTPUT" ;;
            refs/heads/dev) echo phase=ship >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac
        fi
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: ./.github/actions/scope
      id: classify
      if: steps.route.outputs.phase != 'maintenance'
      with:
        stage: dev
        phase: ${{ steps.route.outputs.phase }}
    - uses: ./.github/actions/security
      if: steps.classify.outputs.security == 'true'
      with:
        stage: dev
  backend:
    needs: scope
    if: needs.scope.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ./.github/actions/backend
      with:
        stage: dev
  frontend:
    needs: scope
    if: needs.scope.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ./.github/actions/frontend
      with:
        stage: dev
        phase: ${{ needs.scope.outputs.phase }}
      id: build
    outputs:
      site_sha256: ${{ steps.build.outputs.site_sha256 }}
  infra:
    needs: scope
    if: needs.scope.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ./.github/actions/infra
      with:
        stage: dev
  image:
    needs: scope
    if: needs.scope.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ./.github/actions/image
  required-checks:
    name: dev-required-checks
    needs:
    - scope
    - backend
    - frontend
    - infra
    - image
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Require route and security success
      env:
        SCOPE: ${{ needs.scope.result }}
      run: test "$SCOPE" = success
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ./.github/actions/gate
      with:
        scope: ${{ needs.scope.outputs.scope }}
        results: ${{ toJSON(needs) }}
  deploy:
    needs:
    - scope
    - frontend
    - required-checks
    if: ${{ always() && !cancelled() && needs.required-checks.result == 'success' && needs.scope.outputs.phase == 'ship' &&
      needs.scope.outputs.deploy == 'true' && needs.frontend.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev
    permissions:
      contents: read
      id-token: write
    outputs:
      configured: ${{ steps.binding.outputs.configured }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      SITE_BUCKET: ${{ vars.SITE_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
      DEPLOYMENT_ENV: dev
      EXPECTED_SITE_SHA256: ${{ needs.frontend.outputs.site_sha256 }}
      BACKEND_CHANGED: ${{ needs.scope.outputs.backend_runtime }}
    steps:
    - id: binding
      name: Require a complete deploy target
      run: |
        set -euo pipefail
        for name in AWS_REGION AWS_ACCOUNT_ID AWS_DEPLOY_ROLE_ARN SITE_BUCKET CLOUDFRONT_DISTRIBUTION_ID SITE_URL; do
          if [ -z "${!name}" ]; then echo "::error::Missing environment binding: $name"; exit 1; fi
        done
        test "$BACKEND_CHANGED" != true || { echo "::error::Backend delivery is unavailable; configure a real backend host before release."; exit 1; }
        echo configured=true >> "$GITHUB_OUTPUT"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ./.github/actions/ship
      with:
        role: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
