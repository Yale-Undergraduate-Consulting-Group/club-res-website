name: Intake
'on':
  push:
    branches:
    - feature/*
  pull_request:
    branches:
    - integration
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/feature/') }}
jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      phase: ${{ steps.route.outputs.phase }}
      scope: ${{ steps.classify.outputs.scope }}
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
      infra: ${{ steps.classify.outputs.infra }}
      image: ${{ steps.classify.outputs.image }}
      security: ${{ steps.classify.outputs.security }}
      deploy: ${{ steps.classify.outputs.deploy }}
    steps:
    - id: route
      name: Select the stage operation
      env:
        EVENT: ${{ github.event_name }}
        REF: ${{ github.ref }}
        HEAD_REF: ${{ github.head_ref }}
        BASE_REF: ${{ github.base_ref }}
        SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
      run: |
        set -euo pipefail
        if [ "$EVENT" = pull_request ]; then
          test "$SAME_REPOSITORY" = true
          test "$BASE_REF" = "integration"
          case "$HEAD_REF" in feature/*) ;; *) exit 1 ;; esac
          case "${HEAD_REF:-${REF#refs/heads/}}" in feature/*/*|feature/) exit 1 ;; esac
          echo phase=verify >> "$GITHUB_OUTPUT"
        else
          case "$REF" in
            refs/heads/feature/*/*|refs/heads/feature/) exit 1 ;;
            refs/heads/feature/*) echo phase=verify >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac
        fi
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: ./.github/actions/scope
      id: classify
      with:
        stage: intake
        phase: ${{ steps.route.outputs.phase }}
    - uses: ./.github/actions/security
      if: steps.classify.outputs.security == 'true'
      with:
        stage: intake
  backend:
    needs: scope
    if: needs.scope.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ./.github/actions/backend
      with:
        stage: intake
  frontend:
    needs: scope
    if: needs.scope.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ./.github/actions/frontend
      with:
        stage: intake
        phase: ${{ needs.scope.outputs.phase }}
      id: build
    outputs:
      site_sha256: ${{ steps.build.outputs.site_sha256 }}
  infra:
    needs: scope
    if: needs.scope.outputs.infra == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ./.github/actions/infra
      with:
        stage: intake
  required-checks:
    name: intake-required-checks
    needs:
    - scope
    - backend
    - frontend
    - infra
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Require route and security success
      env:
        SCOPE: ${{ needs.scope.result }}
      run: test "$SCOPE" = success
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ./.github/actions/gate
      with:
        scope: ${{ needs.scope.outputs.scope }}
        results: ${{ toJSON(needs) }}
