name: Production
'on':
  push:
    branches:
    - prod
  pull_request:
    branches:
    - prod
  workflow_dispatch:
    inputs:
      operation:
        description: Application delivery or reviewed infrastructure operation
        type: choice
        options:
        - deliver
        - plan
        - apply
        default: deliver
      target:
        description: Infrastructure account
        type: choice
        options:
        - dev
        - prod
        default: prod
      plan_run_id:
        description: Reviewed saved plan run ID
        type: string
      plan_sha256:
        description: Reviewed saved plan SHA256
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/feature/') }}
jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      phase: ${{ steps.route.outputs.phase }}
      scope: ${{ steps.classify.outputs.scope }}
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
      infra: ${{ steps.classify.outputs.infra }}
      image: ${{ steps.classify.outputs.image }}
      security: ${{ steps.classify.outputs.security }}
      deploy: ${{ steps.classify.outputs.deploy }}
    steps:
    - id: route
      name: Select the stage operation
      env:
        EVENT: ${{ github.event_name }}
        REF: ${{ github.ref }}
        HEAD_REF: ${{ github.head_ref }}
        BASE_REF: ${{ github.base_ref }}
        SAME_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        OPERATION: ${{ inputs.operation || 'deliver' }}
      run: |
        set -euo pipefail
        if [ "$OPERATION" != deliver ]; then
          test "$REF" = refs/heads/prod
          case "$OPERATION" in plan|apply) ;; *) exit 1 ;; esac
          echo phase=maintenance >> "$GITHUB_OUTPUT"
          exit 0
        fi
        if [ "$EVENT" = pull_request ]; then
          test "$SAME_REPOSITORY" = true
          test "$BASE_REF" = "prod"
          case "$HEAD_REF" in dev) ;; *) exit 1 ;; esac
          echo phase=verify >> "$GITHUB_OUTPUT"
        else
          case "$REF" in
            refs/heads/dev) echo phase=verify >> "$GITHUB_OUTPUT" ;;
            refs/heads/prod) echo phase=ship >> "$GITHUB_OUTPUT" ;;
            *) exit 1 ;;
          esac
        fi
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
      if: steps.route.outputs.phase != 'maintenance'
    - uses: ./.github/actions/scope
      id: classify
      if: steps.route.outputs.phase != 'maintenance'
      with:
        stage: production
        phase: ${{ steps.route.outputs.phase }}
    - uses: ./.github/actions/security
      if: steps.classify.outputs.security == 'true'
      with:
        stage: production
  backend:
    needs: scope
    if: needs.scope.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ./.github/actions/backend
      with:
        stage: production
  frontend:
    needs: scope
    if: needs.scope.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ./.github/actions/frontend
      with:
        stage: production
        phase: ${{ needs.scope.outputs.phase }}
      id: build
    outputs:
      site_sha256: ${{ steps.build.outputs.site_sha256 }}
  infra:
    needs: scope
    if: needs.scope.outputs.infra == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ./.github/actions/infra
      with:
        stage: production
  image:
    needs: scope
    if: needs.scope.outputs.image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ./.github/actions/image
      with:
        phase: ${{ needs.scope.outputs.phase }}
      id: build
    outputs:
      image_sha256: ${{ steps.build.outputs.image_sha256 }}
  required-checks:
    name: production-required-checks
    needs:
    - scope
    - backend
    - frontend
    - infra
    - image
    if: ${{ always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.operation == '' || inputs.operation
      == 'deliver') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
    - name: Require route and security success
      env:
        SCOPE: ${{ needs.scope.result }}
      run: test "$SCOPE" = success
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: ./.github/actions/gate
      with:
        scope: ${{ needs.scope.outputs.scope }}
        results: ${{ toJSON(needs) }}
    - name: Require the exact candidate deployment in dev
      if: needs.scope.outputs.phase == 'verify'
      env:
        GH_TOKEN: ${{ github.token }}
        CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      run: python3 scripts/promote.py --verify-dev "$CANDIDATE_SHA"
  deploy:
    needs:
    - scope
    - frontend
    - image
    - required-checks
    if: ${{ always() && !cancelled() && needs.required-checks.result == 'success' && needs.scope.outputs.phase == 'ship' &&
      needs.scope.outputs.deploy == 'true' && needs.frontend.result == 'success' && needs.image.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: prod
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      BOX_INSTANCE_ID: ${{ vars.BOX_INSTANCE_ID }}
      SITE_BUCKET: ${{ vars.SITE_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
      DEPLOYMENT_ENV: prod
      EXPECTED_IMAGE_SHA256: ${{ needs.image.outputs.image_sha256 }}
      EXPECTED_SITE_SHA256: ${{ needs.frontend.outputs.site_sha256 }}
    steps:
    - name: Require a complete deploy target
      run: |
        set -euo pipefail
        for name in AWS_REGION AWS_ACCOUNT_ID AWS_DEPLOY_ROLE_ARN ECR_REPOSITORY BOX_INSTANCE_ID SITE_BUCKET CLOUDFRONT_DISTRIBUTION_ID SITE_URL; do
          if [ -z "${!name}" ]; then echo "::error::Missing environment binding: $name"; exit 1; fi
        done
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 2
    # The required status context can be posted by any workflow in this repository,
    # so the environment-gated job proves the dev deployment itself: the second
    # parent of the merge commit on prod is the dev head that must have deployed.
    - name: Require the merged dev commit to have deployed to dev
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 scripts/promote.py --verify-dev "$(git rev-parse HEAD^2)"
    - uses: ./.github/actions/ship
      with:
        role: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
  infrastructure:
    needs: scope
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.operation == 'plan' || inputs.operation == 'apply') && github.ref
      == 'refs/heads/prod' }}
    environment: infrastructure-${{ inputs.target }}-${{ inputs.operation }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          /tmp/club-terraform
          ~/.terraform.d/plugin-cache
        key: club-terraform-${{ runner.os }}-${{ hashFiles('scripts/install-terraform.sh', 'terraform/.terraform.lock.hcl')
          }}
    - run: bash scripts/install-terraform.sh
    - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
      with:
        role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
        aws-region: ${{ vars.TF_REGION }}
        allowed-account-ids: ${{ vars.TF_ACCOUNT_ID }}
        retry-max-attempts: 3
    - name: Execute the reviewed infrastructure operation
      env:
        OPERATION: ${{ inputs.operation }}
        PLAN_RUN_ID: ${{ inputs.plan_run_id }}
        APPROVED_PLAN_SHA256: ${{ inputs.plan_sha256 }}
        TF_TARGET: ${{ inputs.target }}
        TF_REGION: ${{ vars.TF_REGION }}
        TF_ACCOUNT_ID: ${{ vars.TF_ACCOUNT_ID }}
        TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
        TF_BUDGET_EMAIL: ${{ vars.TF_BUDGET_EMAIL }}
        TF_MONTHLY_BUDGET_USD: ${{ vars.TF_MONTHLY_BUDGET_USD }}
        TF_MANAGE_GITHUB_OIDC_PROVIDER: ${{ vars.TF_MANAGE_GITHUB_OIDC_PROVIDER }}
        TF_INSTANCE_TYPE: ${{ vars.TF_INSTANCE_TYPE }}
        TF_DATA_VOLUME_GB: ${{ vars.TF_DATA_VOLUME_GB }}
        TF_ENABLE_EDGE: ${{ vars.TF_ENABLE_EDGE }}
        TF_ENABLE_WAF: ${{ vars.TF_ENABLE_WAF }}
        TF_ORIGIN_READ_TIMEOUT: ${{ vars.TF_ORIGIN_READ_TIMEOUT }}
        TF_OFFICE_HOURS_ENABLED: ${{ vars.TF_OFFICE_HOURS_ENABLED }}
        TF_CATALOG_OPERATOR_PRINCIPAL_ARNS: ${{ vars.TF_CATALOG_OPERATOR_PRINCIPAL_ARNS }}
      run: bash scripts/terraform-release.sh "$OPERATION"
