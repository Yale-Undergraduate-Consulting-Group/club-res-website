name: Production · Feature to Main
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Club delivery, or a reviewed Terraform plan/apply
        type: choice
        options: [deliver, plan, apply]
        default: deliver
      target:
        description: Terraform target (plan/apply only)
        type: choice
        options: [production, beta]
        default: production
      plan_run_id:
        description: Run ID of the reviewed saved plan (apply only)
        type: string
      plan_sha256:
        description: Exact SHA256 from the reviewed plan (apply only)
        type: string
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Routing, classification and file-level security share one runner.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      phase: ${{ steps.route.outputs.phase }}
      lane: ${{ steps.classify.outputs.lane }}
      scope: ${{ steps.classify.outputs.scope }}
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
      infra: ${{ steps.classify.outputs.infra }}
      image: ${{ steps.classify.outputs.image }}
      security: ${{ steps.classify.outputs.security }}
      runtime: ${{ steps.classify.outputs.runtime }}
      frontend_runtime: ${{ steps.classify.outputs.frontend_runtime }}
      backend_runtime: ${{ steps.classify.outputs.backend_runtime }}
    steps:
      - id: route
        name: Choose Production waterfall
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          OPERATION: ${{ inputs.operation || 'deliver' }}
          TARGET: ${{ inputs.target }}
        run: |
          if [ "$OPERATION" != deliver ]; then
            test "$REF" = refs/heads/main
            case "$OPERATION" in plan|apply) ;; *) exit 1 ;; esac
            echo phase=maintenance >> "$GITHUB_OUTPUT"
            echo "Production: reviewed Terraform $OPERATION for $TARGET. No application delivery." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          case "$REF" in refs/heads/feature|refs/heads/main) ;; *) exit 1 ;; esac
          if [ "$EVENT" = workflow_dispatch ] && [ "$REF" != refs/heads/main ]; then
            echo phase=verify >> "$GITHUB_OUTPUT"
            echo 'Production: feature → main. Every boundary, UI tests, and the backend image when the backend changed. No ship until main.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo phase=ship >> "$GITHUB_OUTPUT"
            echo 'Production: main. Rebuild the static site and publish it after environment approval.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.route.outputs.phase != 'maintenance'
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/scope
        id: classify
        if: steps.route.outputs.phase != 'maintenance'
        with:
          stage: production
          phase: ${{ steps.route.outputs.phase }}
      - uses: ./.github/actions/security
        if: steps.classify.outputs.security == 'true'
  backend:
    timeout-minutes: 15
    needs: scope
    if: needs.scope.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/backend
        with:
          stage: production
  frontend:
    timeout-minutes: 15
    needs: scope
    if: needs.scope.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      site_sha256: ${{ steps.build.outputs.site_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/frontend
        id: build
        with:
          stage: production
          phase: ${{ needs.scope.outputs.phase }}
  infra:
    timeout-minutes: 15
    needs: scope
    if: needs.scope.outputs.infra == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/infra
  image:
    timeout-minutes: 15
    needs: scope
    if: needs.scope.outputs.image == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/image
  # The aggregate check also accounts for every selected lane (no separate gate runner).
  required-checks:
    name: production-required-checks
    if: ${{ always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.operation == 'deliver') }}
    needs: [scope, backend, frontend, infra, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require routing, classification and security scans
        env:
          SCOPE: ${{ needs.scope.result }}
        run: test "$SCOPE" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/gate
        with:
          scope: ${{ needs.scope.outputs.scope }}
          results: ${{ toJSON(needs) }}
  deploy:
    needs: [required-checks, scope, frontend]
    if: ${{ always() && !cancelled() && needs.required-checks.result == 'success' && needs.scope.result == 'success' && needs.frontend.result == 'success' && needs.scope.outputs.frontend_runtime == 'true' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'deliver')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    outputs:
      configured: ${{ steps.binding.outputs.configured }}
      missing: ${{ steps.binding.outputs.missing }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      SITE_BUCKET: ${{ vars.SITE_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
      DEPLOYMENT_ENV: production
      EXPECTED_SITE_SHA256: ${{ needs.frontend.outputs.site_sha256 }}
    steps:
      # Environment variables are visible only inside a job bound to the
      # environment, so the deploy decision is made here, before any AWS call.
      - id: binding
        name: Check that the production environment names its AWS target
        run: |
          missing=""
          for name in AWS_REGION AWS_ACCOUNT_ID AWS_DEPLOY_ROLE_ARN SITE_BUCKET CLOUDFRONT_DISTRIBUTION_ID SITE_URL; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "missing=${missing# }" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.binding.outputs.configured == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/ship
        if: steps.binding.outputs.configured == 'true'
        with:
          role: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
  # Outcome, release record and promotion share one runner. Every step runs
  # default-branch code or reads results; none runs candidate code.
  promote:
    needs: [required-checks, scope, deploy]
    if: ${{ always() && !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.operation == 'deliver') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
      statuses: write
    steps:
      - id: outcome
        name: Explain deployment eligibility and reject unexpected skips
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          VERIFIED: ${{ needs.required-checks.result }}
          SITE_CHANGED: ${{ needs.scope.outputs.frontend_runtime }}
          BACKEND_CHANGED: ${{ needs.scope.outputs.backend_runtime }}
          DEPLOYED: ${{ needs.deploy.result }}
          CONFIGURED: ${{ needs.deploy.outputs.configured }}
          MISSING: ${{ needs.deploy.outputs.missing }}
        run: |
          test "$VERIFIED" = success
          {
            if { [ "$EVENT" = push ] || [ "$EVENT" = workflow_dispatch ]; } && [ "$REF" = refs/heads/main ] && [ "$SITE_CHANGED" = true ]; then
              test "$DEPLOYED" = success
              if [ "$CONFIGURED" = true ]; then
                echo 'Production site published, CloudFront invalidated, and the live site serves this revision.'
              else
                echo "Production verification passed. Not deployed: the production environment does not set ${MISSING}."
              fi
            else
              echo 'No site deployment: verification run, non-main ref, or no frontend changes. All selected checks passed.'
            fi
            if [ "$BACKEND_CHANGED" = true ]; then
              echo 'backend verified; no backend host configured'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # Load the controller from the protected default branch, never from candidate code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Advance the next club branch
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_DISPATCH: '1'
          PROMOTION_PUBLISH_CHECK: '1'
          PROMOTION_STAGE: Production
        run: python3 scripts/promote.py
      - name: Record deployed revision and semantic version
        if: ${{ !cancelled() && steps.outcome.outcome == 'success' && needs.deploy.result == 'success' && needs.deploy.outputs.configured == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: production
        run: python3 scripts/release_version.py
  infrastructure:
    needs: scope
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.operation == 'plan' || inputs.operation == 'apply') && github.ref == 'refs/heads/main' }}
    environment: infrastructure-${{ inputs.target }}-${{ inputs.operation }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            /tmp/club-terraform
            ~/.terraform.d/plugin-cache
          key: club-terraform-${{ runner.os }}-${{ hashFiles('scripts/install-terraform.sh', 'terraform/.terraform.lock.hcl') }}
      - run: bash scripts/install-terraform.sh
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.TF_REGION }}
          allowed-account-ids: ${{ vars.TF_ACCOUNT_ID }}
          retry-max-attempts: 3
      - name: Execute the reviewed infrastructure operation
        env:
          OPERATION: ${{ inputs.operation }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          APPROVED_PLAN_SHA256: ${{ inputs.plan_sha256 }}
          TF_TARGET: ${{ inputs.target }}
          TF_REGION: ${{ vars.TF_REGION }}
          TF_ACCOUNT_ID: ${{ vars.TF_ACCOUNT_ID }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
          TF_BUDGET_EMAIL: ${{ vars.TF_BUDGET_EMAIL }}
          TF_MONTHLY_BUDGET_USD: ${{ vars.TF_MONTHLY_BUDGET_USD }}
          TF_MANAGE_GITHUB_OIDC_PROVIDER: ${{ vars.TF_MANAGE_GITHUB_OIDC_PROVIDER }}
        run: bash scripts/terraform-release.sh "$OPERATION"
