name: Promotion
'on':
  workflow_run:
    workflows:
    - Intake
    - Dev
    - Production
    - Review
    types:
    - completed
permissions:
  contents: write
  pull-requests: write
  actions: write
  statuses: write
concurrency:
  group: trusted-promotion
  cancel-in-progress: false
jobs:
  advance:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.event.repository.default_branch }}
        persist-credentials: false
    # Merges go through the promotion GitHub App so the merge push starts the
    # next stage's workflows (a GITHUB_TOKEN push starts none). Its token can
    # only write contents and pull requests on this repository, and only this
    # default-branch job holds it; without the app, auto-merge stays off.
    - name: Promotion app token
      id: app
      if: ${{ vars.PROMOTION_APP_CLIENT_ID != '' }}
      uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
      with:
        client-id: ${{ vars.PROMOTION_APP_CLIENT_ID }}
        private-key: ${{ secrets.PROMOTION_APP_PRIVATE_KEY }}
        permission-contents: write
        permission-pull-requests: write
    - name: Advance stage PRs
      env:
        GH_TOKEN: ${{ github.token }}
        PROMOTION_MERGE_TOKEN: ${{ steps.app.outputs.token }}
      run: python3 scripts/promote.py
