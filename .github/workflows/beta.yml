name: Beta · Develop to Feature
on:
  push:
    branches: [feature]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # Routing, classification and file-level security share one runner.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      phase: ${{ steps.route.outputs.phase }}
      lane: ${{ steps.classify.outputs.lane }}
      scope: ${{ steps.classify.outputs.scope }}
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
      infra: ${{ steps.classify.outputs.infra }}
      image: ${{ steps.classify.outputs.image }}
      security: ${{ steps.classify.outputs.security }}
      runtime: ${{ steps.classify.outputs.runtime }}
      frontend_runtime: ${{ steps.classify.outputs.frontend_runtime }}
      backend_runtime: ${{ steps.classify.outputs.backend_runtime }}
    steps:
      - id: route
        name: Choose Beta waterfall
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          case "$REF" in refs/heads/develop|refs/heads/feature) ;; *) exit 1 ;; esac
          if [ "$EVENT" = workflow_dispatch ] && [ "$REF" != refs/heads/feature ]; then
            echo phase=verify >> "$GITHUB_OUTPUT"
            echo 'Beta: develop → feature. Full candidate checks; backend image only when the backend changed. No deploy.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo phase=ship >> "$GITHUB_OUTPUT"
            echo 'Beta: feature. Rebuild the static site and publish it to the beta environment when that environment is configured.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/scope
        id: classify
        with:
          stage: beta
          phase: ${{ steps.route.outputs.phase }}
      - uses: ./.github/actions/security
        if: steps.classify.outputs.security == 'true'
  backend:
    timeout-minutes: 15
    needs: scope
    if: needs.scope.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/backend
        with:
          stage: beta
  frontend:
    timeout-minutes: 15
    needs: scope
    if: needs.scope.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      site_sha256: ${{ steps.build.outputs.site_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/frontend
        id: build
        with:
          stage: beta
          phase: ${{ needs.scope.outputs.phase }}
  infra:
    timeout-minutes: 15
    needs: scope
    if: needs.scope.outputs.infra == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/infra
  image:
    timeout-minutes: 15
    needs: scope
    if: needs.scope.outputs.image == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/image
  # The aggregate check also accounts for every selected lane (no separate gate runner).
  required-checks:
    name: feature-required-checks
    if: ${{ always() && !cancelled() }}
    needs: [scope, backend, frontend, infra, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require routing, classification and security scans
        env:
          SCOPE: ${{ needs.scope.result }}
        run: test "$SCOPE" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/gate
        with:
          scope: ${{ needs.scope.outputs.scope }}
          results: ${{ toJSON(needs) }}
  deploy:
    needs: [required-checks, scope, frontend]
    if: ${{ always() && !cancelled() && needs.required-checks.result == 'success' && needs.scope.result == 'success' && needs.frontend.result == 'success' && needs.scope.outputs.frontend_runtime == 'true' && github.ref == 'refs/heads/feature' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: beta
    permissions:
      contents: read
      id-token: write
    outputs:
      configured: ${{ steps.binding.outputs.configured }}
      missing: ${{ steps.binding.outputs.missing }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      AWS_DEPLOY_ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      SITE_BUCKET: ${{ vars.SITE_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      SITE_URL: ${{ vars.SITE_URL }}
      DEPLOYMENT_ENV: beta
      EXPECTED_SITE_SHA256: ${{ needs.frontend.outputs.site_sha256 }}
    steps:
      # Environment variables are visible only inside a job bound to the
      # environment, so the deploy decision is made here, before any AWS call.
      - id: binding
        name: Check that the beta environment names its AWS target
        run: |
          missing=""
          for name in AWS_REGION AWS_ACCOUNT_ID AWS_DEPLOY_ROLE_ARN SITE_BUCKET CLOUDFRONT_DISTRIBUTION_ID SITE_URL; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "missing=${missing# }" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: steps.binding.outputs.configured == 'true'
        with:
          persist-credentials: false
      - uses: ./.github/actions/ship
        if: steps.binding.outputs.configured == 'true'
        with:
          role: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
  # Outcome, release record and promotion share one runner. Every step runs
  # default-branch code or reads results; none runs candidate code.
  promote:
    needs: [required-checks, scope, deploy]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
      statuses: write
    steps:
      - id: outcome
        name: Explain deployment eligibility and reject unexpected skips
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          VERIFIED: ${{ needs.required-checks.result }}
          SITE_CHANGED: ${{ needs.scope.outputs.frontend_runtime }}
          BACKEND_CHANGED: ${{ needs.scope.outputs.backend_runtime }}
          DEPLOYED: ${{ needs.deploy.result }}
          CONFIGURED: ${{ needs.deploy.outputs.configured }}
          MISSING: ${{ needs.deploy.outputs.missing }}
        run: |
          test "$VERIFIED" = success
          {
            if { [ "$EVENT" = push ] || [ "$EVENT" = workflow_dispatch ]; } && [ "$REF" = refs/heads/feature ] && [ "$SITE_CHANGED" = true ]; then
              test "$DEPLOYED" = success
              if [ "$CONFIGURED" = true ]; then
                echo 'Beta site published, CloudFront invalidated, and the live site serves this revision.'
              else
                echo "Beta verification passed. Not deployed: the beta environment does not set ${MISSING}."
              fi
            else
              echo 'No site deployment: verification run, non-feature ref, or no frontend changes. All selected checks passed.'
            fi
            if [ "$BACKEND_CHANGED" = true ]; then
              echo 'backend verified; no backend host configured'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      # Load the controller from the protected default branch, never from candidate code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Advance the next club branch
        env:
          GH_TOKEN: ${{ github.token }}
          PROMOTION_DISPATCH: '1'
          PROMOTION_PUBLISH_CHECK: '1'
          PROMOTION_STAGE: Beta
        run: python3 scripts/promote.py
      - name: Record deployed revision and semantic version
        if: ${{ !cancelled() && steps.outcome.outcome == 'success' && needs.deploy.result == 'success' && needs.deploy.outputs.configured == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: beta
        run: python3 scripts/release_version.py
