name: Backend tests
description: FastAPI backend tests for staged club delivery.
inputs:
  stage:
    description: Stage supplied by the stage workflow.
    required: true
runs:
  using: composite
  steps:
    - id: present
      name: Locate the backend
      shell: bash
      run: |
        if [ ! -e backend ]; then
          echo present=false >> "$GITHUB_OUTPUT"
          echo 'Backend: this revision has no backend/; nothing to test.' >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi
        if [ ! -f backend/requirements.txt ]; then
          echo '::error::backend/ exists without backend/requirements.txt'
          exit 1
        fi
        echo present=true >> "$GITHUB_OUTPUT"
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      if: steps.present.outputs.present == 'true'
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: backend/requirements*.txt
    - name: Install dependencies
      if: steps.present.outputs.present == 'true'
      shell: bash
      working-directory: backend
      run: |
        python -m pip install -q -r requirements.txt
        if [ -f requirements-dev.txt ]; then
          python -m pip install -q -r requirements-dev.txt
        fi
    # Tests run from backend/ so `import main` resolves exactly as in the container.
    - name: Run fast Intake tests
      if: steps.present.outputs.present == 'true' && inputs.stage == 'intake'
      shell: bash
      working-directory: backend
      run: python -m pytest -q -m "not slow" tests
    - name: Run the full backend suite
      if: steps.present.outputs.present == 'true' && inputs.stage != 'intake'
      shell: bash
      working-directory: backend
      run: python -m pytest -q tests
