name: Classify the diff
description: Classify the diff for staged club delivery.
inputs:
  stage:
    description: Stage supplied by the stage workflow.
    required: true
  phase:
    description: Phase supplied by the stage workflow.
    required: true
outputs:
  scope:
    description: Scope computed for this revision.
    value: ${{ steps.changes.outputs.scope }}
  backend:
    description: Backend test lane required.
    value: ${{ steps.changes.outputs.backend }}
  frontend:
    description: Frontend checks and build required.
    value: ${{ steps.changes.outputs.frontend }}
  infra:
    description: Terraform and controller test lane required.
    value: ${{ steps.changes.outputs.infra }}
  image:
    description: Application image build and scan required; every deployment ships one.
    value: ${{ steps.changes.outputs.image }}
  security:
    description: File-level security scans required.
    value: ${{ steps.changes.outputs.security }}
  deploy:
    description: Non-documentation change requires downstream deployment.
    value: ${{ steps.changes.outputs.deploy }}
runs:
  using: composite
  steps:
    - id: changes
      shell: bash
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        STAGE: ${{ inputs.stage }}
        PHASE: ${{ inputs.phase }}
      run: python3 scripts/ci_policy.py "$STAGE"
